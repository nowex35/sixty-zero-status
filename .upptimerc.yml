# SIXTYZERO ステータス(Upptime の設定)
# 書き方: https://upptime.js.org/docs/configuration
owner: nowex35
repo: sixty-zero-status
user-agent: nowex35

# 使う secret は無い(GH_PAT はワークフローが別に渡すので、ここには書かない)
secrets: []

# 測るのは sixty-zero.app の公開パスだけ。Cloud Run の直接の URL・内部の URL は書かない。
# slug は履歴ファイル名・Issue のラベル・メンテナンスの expectedDown に使うので固定する。
sites:
  - name: サイト(sixty-zero.app)
    slug: site
    url: https://sixty-zero.app/.well-known/security.txt
    expectedStatusCodes:
      - 200
    # Worker だけで返す本文。これが無ければ 200 でも「停止」にする
    __dangerous__body_down_if_text_missing: "Contact:"

  # 「アプリ・API」は /api/health が本番に出てから有効にする(今は 404 で、入れると「停止」と出続ける)。
  # 有効にするときは下のコメントを外す。外す前に、本番の応答の本文が
  # {"status":"ok","backend":"ok"}(空白なし)であることを curl で確かめる。
  # 失敗時は 503 なので、expectedStatusCodes だけでも「停止」になる。
  #
  # - name: アプリ・API
  #   slug: api
  #   url: https://sixty-zero.app/api/health
  #   expectedStatusCodes:
  #     - 200
  #   __dangerous__body_down_if_text_missing: '"backend":"ok"'

assignees:
  - nowex35

# 定期実行の下限が 5 分(GitHub Actions)。ほかは既定値のまま
workflowSchedule:
  uptime: "*/5 * * * *"

# リポジトリの説明を英語で上書きさせない
skipDescriptionUpdate: true

status-website:
  cname: status.sixty-zero.app
  name: SIXTYZERO ステータス
  introMessage: SIXTYZERO(sixty-zero.app)の稼働状況です。5 分ごとに外から確認しています。障害やメンテナンスのお知らせもここに載せます。
  navbar:
    - title: ステータス
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

